# cdn-deploy network tuning against 503 under load (tech.md §6). lib/sysctl.sh installs it
# as /etc/sysctl.d/99-cdn.conf: edits on the server are overwritten by the next ./deploy.sh.

# Accept queues for bursts of edge connections. nginx listens with backlog=4096, and
# somaxconn caps the backlog when nginx opens the port.
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192

# Ports and TIME_WAIT reuse for many short connections to xray and from the edge.
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# BBR paced by fq keeps throughput up on lossy paths.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
